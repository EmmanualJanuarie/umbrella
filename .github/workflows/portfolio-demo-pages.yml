name: Publish UDES portfolio demo

on:
  push:
    branches: [main]
    paths:
      - "udes/frontend/**"
      - ".github/workflows/portfolio-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: udes/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: udes/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the isolated portfolio site
        run: npm run build:portfolio
        env:
          VITE_PORTFOLIO_DEMO: "true"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: udes/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
